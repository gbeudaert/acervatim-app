org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Use the legacy KSP1 backend. KSP2 (the Analysis-API impl, default in KSP 2.x)
# crashes Hilt's processor with "unexpected jvm signature V" on this Kotlin/Hilt combo.
ksp.useKSP2=false

# Conservés (non dépréciés en AGP 9, comportements toujours pilotables) :
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false

# === Flags dépréciés mais NÉCESSAIRES tant qu'on applique le plugin standalone
# `org.jetbrains.kotlin.android` (au lieu du Kotlin embarqué AGP 9). Ils sont marqués comme
# dépréciés (et déclencheront 2 warnings + 3 obsolete-API warnings) mais sans eux le build
# échoue avec « Cannot add extension with name 'kotlin' ». La migration AGP 10 imposera de
# retirer le plugin Kotlin standalone et de basculer sur le Kotlin embarqué AGP.
# Cf. https://developer.android.com/build/r/new-dsl
android.builtInKotlin=false
android.newDsl=false

# Supprime le sync issue lié à l'absence d'exclusion des composants de bibliothèque des
# contraintes. Le flag de perf (`excludeLibraryComponentsFromConstraints`) est lui-même
# déprécié — son comportement devient le défaut. On suppress juste l'alerte pour l'IDE.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
